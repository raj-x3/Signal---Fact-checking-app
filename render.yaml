# Render Blueprint Specification
# Deploys the SignalCheck India Fact-Checking Platform as a high-performance Web Service
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: signalcheck-platform
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMMA_MODEL_ID
        value: gemma-4-26b-a4b-it
      # Optional external API keys (add values in Render Dashboard if you have them)
      - key: GEMMA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_FACT_CHECK_API_KEY
        sync: false
